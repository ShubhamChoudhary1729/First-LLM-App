<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>API Test — /api/chat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; background: #0f0f0f; color: #e0e0e0; }
    h1 { font-size: 1.2rem; color: #aaa; margin-bottom: 24px; }
    textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 1rem; resize: vertical; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 24px; background: #4f8ef7; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #result { margin-top: 24px; padding: 16px; border-radius: 8px; background: #1a1a1a; border: 1px solid #333; white-space: pre-wrap; min-height: 60px; font-size: 0.95rem; line-height: 1.6; }
    .ok   { border-color: #2ea84366; color: #4ade80; }
    .err  { border-color: #f8712766; color: #f87171; }
    .dim  { color: #555; }
  </style>
</head>
<body>
  <h1>🔧 Backend test — <code>POST /api/chat</code></h1>

  <textarea id="msg" rows="3">What is 2+2?</textarea><br/>
  <button id="btn" onclick="send()">Send to Gemini</button>

  <div id="result" class="dim">Response will appear here…</div>

  <script>
    async function send() {
      const btn = document.getElementById("btn");
      const out = document.getElementById("result");
      const msg = document.getElementById("msg").value.trim();

      if (!msg) { out.textContent = "Please enter a message."; return; }

      btn.disabled = true;
      out.className = "dim";
      out.textContent = "⏳ Calling /api/chat…";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg }),
        });

        const data = await res.json();

        if (res.ok && data.reply) {
          out.className = "ok";
          out.textContent = "✅ Gemini replied:\n\n" + data.reply;
        } else {
          out.className = "err";
          out.textContent = "❌ Error " + res.status + ":\n\n" + JSON.stringify(data, null, 2);
        }
      } catch (e) {
        out.className = "err";
        out.textContent = "❌ Network error (is the dev server running?)\n\n" + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    // Allow Ctrl+Enter to submit
    document.getElementById("msg").addEventListener("keydown", e => {
      if (e.key === "Enter" && e.ctrlKey) send();
    });
  </script>
</body>
</html>
